[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qnxsec"
version = "0.2.0"
description = "Static analysis for QNX systems and firmware: protections, IPC surface, targets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["qnx", "firmware", "security", "reverse-engineering", "static-analysis"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qnxsec = "qnxsec.cli:main"

[tool.setuptools]
packages = ["qnxsec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
