name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # liblzo2 lets the suite check the pure Python decoder against streams from
      # the reference library; without it those tests skip instead of pretending.
      - name: install the reference compression libraries and a compiler
        # The suite checks both decoders against streams produced by liblzo2 and
        # libucl themselves; without them those tests skip instead of pretending.
        run: >-
          sudo apt-get update -qq && sudo apt-get install -y -qq
          liblzo2-dev libucl-dev build-essential
      - name: install
        run: pip install -e ".[dev]"
      - name: test
        run: pytest -q
